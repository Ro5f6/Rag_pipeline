name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests & retrieval evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Model weights are ~500MB and unchanged between runs.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      # The corpus (data/sample_docs) is gitignored, so fetch it from the shared
      # Drive folder before evaluating. The folder must be shared "Anyone with
      # the link". gdown nests the download under a directory named after the
      # Drive folder, so flatten it into data/sample_docs regardless of that
      # name. Caveats: gdown folder downloads are capped at ~50 files and can be
      # rate-limited by Google, which would fail this step unrelated to the code.
      - name: Fetch evaluation corpus
        run: |
          pip install gdown
          tmp=$(mktemp -d)
          gdown --folder "https://drive.google.com/drive/folders/19ctQULoc0GW9M9MpEqVjeMwQiZ_hiHjs" -O "$tmp"
          mkdir -p data/sample_docs
          find "$tmp" -type f -exec mv -f {} data/sample_docs/ \;
          count=$(find data/sample_docs -type f | wc -l)
          echo "Fetched $count corpus files."
          test "$count" -gt 0 || { echo "::error::Corpus download produced no files"; exit 1; }

      # The evaluation harness needs no API key and is deterministic, so it
      # runs as a normal CI step. This is what makes retrieval quality a
      # regression gate rather than something measured once and forgotten.
      - name: Evaluate retrieval quality
        run: python -m evaluation.run_eval

      - name: Publish results to the job summary
        if: always()
        run: cat data/eval/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: data/eval/
